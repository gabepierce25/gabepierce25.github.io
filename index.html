<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabe Snake</title>
    <meta name="description" content="Catch Lea, don't bite yourself. A snake game starring Gabe and Lea.">

    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Gabe Snake">
    <meta property="og:description" content="Catch Lea, don't bite yourself.">
    <meta property="og:image" content="https://gabepierce.com/assets/og-image.jpg">
    <meta property="og:url" content="https://gabepierce.com">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Gabe Snake">
    <meta name="twitter:description" content="Catch Lea, don't bite yourself.">
    <meta name="twitter:image" content="https://gabepierce.com/assets/og-image.jpg">
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #1a1a2e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f5f5f5;
        padding: 24px;
      }

      h1 {
        margin: 0;
        font-size: 40px;
      }

      #scoreboard {
        display: flex;
        gap: 24px;
        font-size: 22px;
      }

      #scoreboard span {
        font-weight: 700;
        color: #ffb703;
      }

      #board-wrap {
        position: relative;
        width: min(800px, 90vw);
        aspect-ratio: 1 / 1;
      }

      canvas {
        background: #16213e;
        border: 4px solid #0f3460;
        border-radius: 8px;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #controls-touch {
        display: none;
      }

      @media (pointer: coarse) {
        #controls {
          display: none;
        }
        #controls-touch {
          display: block;
        }
        body {
          padding: 12px;
          gap: 10px;
        }
        h1 {
          font-size: 28px;
        }
        #board-wrap {
          width: min(420px, 94vw);
          aspect-ratio: 2 / 3;
        }
      }

      #overlay {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(0, 0, 0, 0.75);
        border-radius: 8px;
        text-align: center;
        padding: 16px;
      }

      #overlay.show {
        display: flex;
      }

      #overlay h2 {
        margin: 0;
        font-size: 26px;
      }

      #start-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(0, 0, 0, 0.85);
        border-radius: 8px;
        text-align: center;
        padding: 16px;
      }

      #start-overlay.hide {
        display: none;
      }

      #start-preview {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      #start-preview img {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #ffb703;
      }

      #start-preview .arrow {
        font-size: 40px;
        color: #ffb703;
      }

      #start-preview .food-img {
        width: 160px;
        height: 160px;
        border: 4px solid #e63946;
      }

      #start-overlay h2 {
        margin: 0;
        font-size: 26px;
      }

      button {
        font-size: 16px;
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        background: #ffb703;
        color: #1a1a2e;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #ffc93a;
      }

      button.secondary {
        background: transparent;
        border: 2px solid #ffb703;
        color: #ffb703;
      }

      button.secondary:hover {
        background: rgba(255, 183, 3, 0.15);
      }

      #controls {
        font-size: 14px;
        color: #a0a0c0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>🐍 Gabe Snake 🐍</h1>
    <div id="scoreboard">
      <div>Score: <span id="score">0</span></div>
      <div>Best: <span id="best">0</span></div>
    </div>
    <div id="board-wrap">
      <canvas id="game" width="800" height="800"></canvas>
      <div id="overlay">
        <h2 id="overlay-title">Game Over</h2>
        <p id="overlay-msg"></p>
        <button id="restart-btn">Play Again</button>
      </div>
      <div id="start-overlay">
        <div id="start-preview">
          <img src="assets/gabe.jpg" alt="Gabe's face">
          <span class="arrow">&rarr;</span>
          <img class="food-img" src="assets/lea.jpg" alt="Lea's face">
        </div>
        <h2>Gabe Snake</h2>
        <p>Catch Lea. Don't bite yourself.</p>
        <button id="start-btn">Start Game</button>
      </div>
    </div>

    <p id="controls">Use arrow keys or WASD to move. Catch Lea, don't bite yourself.</p>
    <p id="controls-touch">Swipe up, down, left, or right on the board to move. Catch Lea, don't bite yourself.</p>

    <script src="snake.js?v=6"></script>
  </body>
</html>
